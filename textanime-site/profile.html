<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeSite — Профиль</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="profile">
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>
    <header class="topbar glass">
      <div class="container topbar__inner">
        <a class="brand" href="index.html">
          <span class="brand__mark"></span>
          <span>AnimeSite</span>
        </a>
        <nav class="nav">
          <a href="index.html">Главная</a>
          <a href="catalog.html">Каталог</a>
          <a href="categories.html">Жанры</a>
          <a href="profile.html">Профиль</a>
        </nav>
        <form class="search-form" data-search-form>
          <input type="text" placeholder="Поиск аниме" aria-label="Поиск аниме" />
          <button class="btn btn--primary" type="submit">Найти</button>
        </form>
        <div class="toolbar">
          <select class="select-pill" data-mood-select>
            <option value="epic">Эпичное</option>
            <option value="sad">Грустное</option>
            <option value="fun">Рофл</option>
            <option value="vibe">Вайбовое</option>
          </select>
          <button class="btn btn--ghost" data-theme-toggle>OLED</button>
          <button class="btn btn--primary" data-lucky>Мне повезёт</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="section reveal">
        <div class="section__head">
          <div>
            <h1 class="section__title">Профиль</h1>
            <p class="search-summary">Избранное, оценки и история просмотра в одном месте.</p>
          </div>
        </div>
        <div class="profile-grid">
          <div class="panel">
            <h3>Избранное</h3>
            <div class="list-stack" id="favorites-list"></div>
          </div>
          <div class="panel">
            <h3>Мои оценки</h3>
            <div class="rating-list" id="profile-ratings"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <div>© 2026 AnimeSite. Минимализм, который хочется смотреть снова.</div>
        <div>Каталог · Жанры · Профиль</div>
      </div>
    </footer>

    <div class="toast"></div>
    <script src="js/main.js"></script>
    <script src="js/ratings.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/player.js"></script>
  </body>
</html>
