<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeSite — Плеер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://kit.fontawesome.com/2aed1e5ed4.js" crossorigin="anonymous"></script>
  </head>
  <body data-page="watch">
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>
    <header class="topbar glass">
      <div class="container topbar__inner">
        <a class="brand" href="index.html">
          <span class="brand__mark"></span>
          <span>AnimeSite</span>
        </a>
        <nav class="nav">
          <a href="index.html">Главная</a>
          <a href="catalog.html">Каталог</a>
          <a href="categories.html">Жанры</a>
          <a href="profile.html">Профиль</a>
        </nav>
        <form class="search-form" data-search-form>
          <input type="text" placeholder="Поиск аниме" aria-label="Поиск аниме" />
          <button class="btn btn--primary" type="submit">Найти</button>
        </form>
        <div class="toolbar">
          <select class="select-pill" data-mood-select>
            <option value="epic">Эпичное</option>
            <option value="sad">Грустное</option>
            <option value="fun">Рофл</option>
            <option value="vibe">Вайбовое</option>
          </select>
          <button class="btn btn--ghost" data-theme-toggle>OLED</button>
          <button class="btn btn--primary" data-lucky>Мне повезёт</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="watch-shell reveal">
        <div class="watch-player">
          <div class="video-toolbar">
            <div>
              <h2 id="watch-title">Название</h2>
              <p class="search-summary" id="watch-episode">Эпизод 1</p>
            </div>
            <div class="toolbar">
              <button class="btn btn--ghost" id="cinematic-toggle">Кинематографичный режим</button>
            </div>
          </div>
          <video id="watch-video" controls poster="https://picsum.photos/seed/player/1200/700">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4" />
          </video>
          <div class="hero__actions" style="margin-top: 14px;">
            <button class="btn btn--ghost" id="prev-episode">← Предыдущая</button>
            <button class="btn btn--primary" id="next-episode">Следующая →</button>
          </div>
        </div>
        <aside class="panel">
          <h3>Серии</h3>
          <div class="episode-list" id="episode-list"></div>
          <h3 style="margin-top: 20px;">Рекомендации</h3>
          <div class="related-list" id="watch-recommendations"></div>
        </aside>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <div>© 2026 AnimeSite. Минимализм, который хочется смотреть снова.</div>
        <div>Создано с <i class="fa-regular fa-heart"></i> by ⛧𝕂𝕚𝕥𝕤𝕦𝕟𝕖!</div>
      </div>
    </footer>

    <div class="toast"></div>
    <script src="js/main.js"></script>
    <script src="js/ratings.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/player.js"></script>
  </body>
</html>
